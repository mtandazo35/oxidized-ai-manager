# Overlay para exponer el panel detrás de un proxy EXTERNO (Nginx Proxy
# Manager), que vive en su propio proyecto Docker y no se gestiona aquí.
#
# Conecta el backend a la red del proxy para que NPM lo alcance como
# `http://backend:8000`, sin publicar ningún puerto hacia la LAN.
#
#   1. Averigüe la red de NPM:  docker network ls
#   2. En .env:  PROXY_NETWORK=<esa red>
#                FORWARDED_ALLOW_IPS=<subred de esa red>
#   3. docker compose -f docker-compose.yml -f deploy/docker-compose.proxy.yml up -d
#
# El proxy host de NPM apunta a  backend : 8000  (esquema http; el TLS lo
# termina NPM). No exponga PostgreSQL, Redis ni el 8888 de Oxidized.

services:
  backend:
    networks:
      - core
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Defina PROXY_NETWORK en .env con la red Docker de su proxy}
