name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r backend/requirements-dev.txt
      - name: pytest
        run: pytest -q

  shell:
    name: Scripts de shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis (bash -n)
        run: |
          for f in scripts/*.sh install.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
      - name: shellcheck
        run: shellcheck --severity=warning scripts/*.sh install.sh
      - name: docker compose config (local y con proxy)
        run: |
          cp .env.example .env
          docker compose config --quiet
          printf 'PROXY_NETWORK=npm_default\nCOMPOSE_FILE=docker-compose.yml:deploy/docker-compose.proxy.yml\n' >> .env
          docker compose config --quiet
          docker compose config --format json | grep -q '"npm_default"'

  panel-css:
    name: CSS del panel al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: Compilar Tailwind e incrustarlo en index.html
        working-directory: panel
        run: |
          npm ci
          npm run build
      - name: index.html no debe cambiar
        run: |
          git diff --exit-code backend/app/static/index.html \
            || { echo "::error::El CSS del panel no está al día: ejecute 'cd panel && npm run build' y suba backend/app/static/index.html."; exit 1; }
