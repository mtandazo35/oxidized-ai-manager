pid /tmp/nginx.pid;

events {}

http {
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;

    server {
        listen 80;
        server_name 178.156.243.184;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name 178.156.243.184;

        ssl_certificate /etc/letsencrypt/live/178.156.243.184/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/178.156.243.184/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;

        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
